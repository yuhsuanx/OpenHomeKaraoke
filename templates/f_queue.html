<script src="/static/jquery.ui.touch-punch.min.js"></script>

<div class="d-flex align-items-center justify-content-between mb-3">
	<h1 class="page-title">{{getString1(112)}}</h1>
	<div class="d-flex gap-2">
		<button class="btn btn-sm btn-soft rounded-pill" onclick="get_refresh('/queue/addrandom?amount=3')"><i class="bi bi-shuffle"></i> {{getString1(109)}}</button>
		{% if admin %}
		<button class="btn btn-sm btn-soft rounded-pill text-danger" onclick="clearAll()"><i class="bi bi-trash3"></i> {{getString1(110)}}</button>
		{% endif %}
	</div>
</div>

<ul class="list-group" id="auto-refresh"></ul>

<script>
var queue = [];
var dragging = null;

function update(data){
	if (!data || dragging!=null) return;
	try{queue = JSON.parse(data);}
	catch{console.log(`JSON parse error: ${data}`);return;}
	$("#auto-refresh").html(generateQueueHTML());
	{% if admin %}
	$('#auto-refresh').sortable({
		handle: '.drag-handle',
		axis: 'y',
		tolerance: "pointer",
		start: function( event, ui ){ dragging = ui.item.index() },
		update: function(event, ui){
			var end_posi = ui.item.index();
			$.get("/queue/edit?action=move&from=" + dragging + "&to=" + end_posi + "&size=" + queue.length)
		},
		stop: function( event, ui ){ dragging = null },
	});
	{% endif %}
}

function getQueue() {
	if(dragging==null) $.get('/get_queue').done(update);
}

function generateQueueHTML() {
	if (queue.length == 0)
		return `<li class="list-group-item text-center text-secondary py-5"><i class="bi bi-music-note-list fs-1 d-block mb-2"></i>{{getString1(111)}}</li>`;
	var html = "";
	queue.forEach((e, index) => {
		var song = encodeURIComponent(e.file);
		html += `
		<li class="list-group-item d-flex align-items-center gap-3">
			{% if admin %}<i class="bi bi-grip-vertical drag-handle fs-5"></i>{% endif %}
			<span class="q-num">${index + 1}</span>
			<div class="flex-grow-1 min-w-0" style="min-width:0">
				<div class="text-truncate-2">${esc(e.title)}</div>
				<div class="singer small"><i class="bi bi-person-fill"></i> ${esc(e.user)}</div>
			</div>
			{% if admin %}
			<div class="d-flex gap-1 flex-none">
				<button class="btn btn-sm btn-soft btn-round d-none d-sm-inline-flex" title="{{getString1(105)}}" ${index == 0 ? 'disabled' : ''}
					onclick="get_refresh('/queue/edit?action=up&song=${song}')"><i class="bi bi-chevron-up"></i></button>
				<button class="btn btn-sm btn-soft btn-round d-none d-sm-inline-flex" title="{{getString1(106)}}" ${index + 1 == queue.length ? 'disabled' : ''}
					onclick="get_refresh('/queue/edit?action=down&song=${song}')"><i class="bi bi-chevron-down"></i></button>
				<button class="btn btn-sm btn-soft btn-round text-danger" title="{{getString1(113)}}"
					onclick="get_refresh('/queue/edit?action=delete&song=${song}')"><i class="bi bi-x-lg"></i></button>
			</div>
			{% endif %}
		</li>`;
	});
	return html;
}

function clearAll() {
	if(confirm("{{getString1(108)}}")) $.get("/queue/edit?action=clear");
}

getQueue();
</script>
