<!-- Now playing -->
<section class="ok-card np-hero p-4 mb-3">
	<div class="d-flex align-items-center justify-content-between">
		<span class="section-label">{{getString1(74)}}</span>
		<span id="np-eq" class="eq control-box" hidden><i></i><i></i><i></i></span>
	</div>
	<div class="np-head">
		<h1 id="now-playing" class="np-title"></h1>
		<span class="np-user control-box" hidden><i class="bi bi-person-fill"></i> <span id="now-playing-user"></span></span>
	</div>

	<div class="control-box mt-3" hidden>
		<input id="seektrack" type="range" class="form-range" min="0" max="{{ seektrack_max }}" value="{{ seektrack_value }}"
			onmousedown="seektrack_seeking=true" onmouseup="seektrack_seeking=false"
			ontouchstart="seektrack_seeking=true" ontouchend="seektrack_seeking=false">
		<div class="d-flex justify-content-between align-items-center time">
			<span id="seektrack-val">0:00</span>
			<div class="d-flex gap-2">
				<button class="btn btn-sm btn-soft rounded-pill seek-by" data-sec="-5"><i class="bi bi-arrow-counterclockwise"></i> 5秒</button>
				<button id="chorus" class="btn btn-sm btn-soft rounded-pill" disabled><i class="bi bi-music-note-beamed"></i> 副歌</button>
				<button class="btn btn-sm btn-soft rounded-pill seek-by" data-sec="5">5秒 <i class="bi bi-arrow-clockwise"></i></button>
			</div>
			<span id="seektrack-max">0:00</span>
		</div>

		<div class="vol-row mt-2" title="{{getString1(83)}}">
			<i class="bi bi-volume-up-fill vol-icon"></i>
			<input id="vol" type="range" class="form-range" min="0" max="512" step="8" value="{{ volume }}"
				onmousedown="volume_changing=true" ontouchstart="volume_changing=true">
			<span id="vol-pct" class="vol-pct"></span>
		</div>

		<div class="ctl-buttons mt-3">
			<button id="pause-btn" class="btn btn-soft pill" title="{{getString1(80)}}"><i id="pause-resume" class="bi bi-pause-fill"></i> <span id="pause-label">暫停</span></button>
			<button id="skip" class="btn btn-soft pill" title="{{getString1(81)}}"><i class="bi bi-skip-end-fill"></i> 切歌</button>
			<button id="guide" class="btn btn-soft pill" role="switch"><i class="bi bi-mic-fill"></i> 導唱 <span id="guide-state"></span></button>
		</div>
	</div>
</section>

<!-- Up next -->
<section class="ok-card p-3 px-4 mb-3">
	<div class="section-label mb-1">{{getString1(75)}}</div>
	<div id="up-next" class="d-flex align-items-center justify-content-between gap-3"></div>
</section>

<!-- Fine-tuning -->
<section class="ok-card p-3 px-4 control-box" hidden>
	{% if show_transpose %}
	<div class="ctl-row">
		<div class="flex-grow-1">
			<div class="d-flex justify-content-between align-items-center mb-1">
				<span>{{getString1(68)}} <button id="semitones-info" class="info-btn"><i class="bi bi-info-circle"></i></button></span>
				<span><span id="semitones-label" class="text-secondary small"></span>
					<button id="reset_key" class="btn btn-sm btn-soft rounded-pill ms-2 text-nowrap" hidden title="{{getString1(203)}}" onclick="$.get('/transpose/0')">{{getString1(204)}}</button></span>
			</div>
			<input id="transpose" type="range" class="form-range" min="-12" max="12" value="{{ transpose_value }}"
				onmousedown="transpose_seeking=true" onmouseup="transpose_seeking=false"
				ontouchstart="transpose_seeking=true" ontouchend="transpose_seeking=false">
		</div>
	</div>
	<div class="ctl-row">
		<div class="flex-grow-1">
			<div class="d-flex justify-content-between align-items-center mb-1">
				<span>{{getString1(199)}} <button id="playspeed-info" class="info-btn"><i class="bi bi-info-circle"></i></button></span>
				<span class="stepper">
					<input id="playspeed-val" type="number" step="0.05" min="0.5" max="2" title="{{getString1(202)}}" onfocus="playspeed_typing=true">
					<span class="text-secondary">x</span>
					<button id="reset_speed" class="btn btn-sm btn-soft rounded-pill ms-1 text-nowrap" hidden title="{{getString1(201)}}" onclick="$.get('/play_speed/1')">{{getString1(205)}}</button>
				</span>
			</div>
			<input id="playspeed" type="range" class="form-range" min="80" max="120" value="{{ play_speed }}"
				onmousedown="playspeed_seeking=true" onmouseup="playspeed_seeking=false"
				ontouchstart="playspeed_seeking=true" ontouchend="playspeed_seeking=false">
		</div>
	</div>
	{% endif %}

	<div class="ctl-row">
		<span>{{getString1(77)}} <button id="audiodelay-info" class="info-btn"><i class="bi bi-info-circle"></i></button></span>
		<span class="stepper">
			<button id="delay-dec" class="btn btn-soft btn-round" title="{{getString1(88)}}"><i class="bi bi-dash-lg"></i></button>
			<input id="delay-val" type="number" step="0.1" title="{{getString1(89)}}" value="0" onfocus="audiodelay_typing=true">
			<button id="delay-inc" class="btn btn-soft btn-round" title="{{getString1(90)}}"><i class="bi bi-plus-lg"></i></button>
		</span>
	</div>

	<div class="ctl-row" id="subdelay-box">
		<span>{{getString1(78)}} <button id="subdelay-info" class="info-btn"><i class="bi bi-info-circle"></i></button></span>
		<span class="stepper">
			<button id="subtitle-sel" class="btn btn-soft btn-round" title="{{getString1(198)}}"><i class="bi bi-badge-cc"></i></button>
			<button id="subdelay-dec" class="btn btn-soft btn-round" title="{{getString1(85)}}"><i class="bi bi-dash-lg"></i></button>
			<input id="subdelay-val" type="number" step="0.1" title="{{getString1(86)}}" value="0" onfocus="subdelay_typing=true">
			<button id="subdelay-inc" class="btn btn-soft btn-round" title="{{getString1(87)}}"><i class="bi bi-plus-lg"></i></button>
		</span>
	</div>
</section>

<script>
var transpose_seeking = false, seektrack_seeking = false, playspeed_seeking = false;
var audiodelay_typing = false, playspeed_typing = false, subdelay_typing = false, volume_changing = false;
var seektrack = $("#seektrack")[0];
var obj = {};

function getSemitonesLabel(value) {return value>0 ? ("+"+value+"{{getString1(91)}}"):(value + "{{getString1(91)}}");}
function getHHMMSS(value) {
	value = Math.max(0, Math.floor(value || 0));
	var h = Math.floor(value/3600), m = Math.floor(value%3600/60), s = value%60;
	return (h ? h+':'+String(m).padStart(2,'0') : m) + ':' + String(s).padStart(2,'0');
}
function setPaused(paused){
	$("#pause-resume").toggleClass("bi-play-fill", paused).toggleClass("bi-pause-fill", !paused);
	$("#pause-label").text(paused ? '繼續' : '暫停');
	$("#np-eq").toggleClass("paused", paused);
}
function update(data){
	try{obj = JSON.parse(data);}
	catch{console.log(`JSON parse error: ${data}`);return;}
	if (obj.now_playing) {
		$("#now-playing").removeClass('np-empty').text(obj.now_playing);
		$("#now-playing-user").text(obj.now_playing_user);
		$(".control-box").prop('hidden', false);

		if ($("#transpose").length){
			if(!transpose_seeking){
				$("#transpose").val(obj.transpose_value);
				$("#semitones-label").text(getSemitonesLabel(obj.transpose_value));
				$("#reset_key").prop('hidden', obj.transpose_value==0);
			}
			if(!playspeed_seeking){
				$("#playspeed").val(Math.round(obj.play_speed*100));
				var spd_val = parseFloat(obj.play_speed).toFixed(2);
				$("#playspeed").prop('hidden', !(spd_val>=0.8 && spd_val<=1.2));
				if(!playspeed_typing && obj.play_speed!=null){
					$("#playspeed-val").val(obj.play_speed.toFixed(2));
					$("#reset_speed").prop('hidden', obj.play_speed==1);
				}
			}
		}

		if(!seektrack_seeking){
			$("#seektrack").attr('max', obj.seektrack_max).val(obj.seektrack_value);
			$("#seektrack-val").text(getHHMMSS(obj.seektrack_value));
			$("#seektrack-max").text(getHHMMSS(obj.seektrack_max));
			$("#chorus").prop('disabled', !obj.has_chorus);
		}

		if(obj.audio_delay!==null && !audiodelay_typing)
			$("#delay-val").val(obj.audio_delay.toFixed(2));

		if("subtitle_delay" in obj){
			$("#subdelay-box").prop('hidden', false);
			if(obj.subtitle_delay!==null && !subdelay_typing)
				$("#subdelay-val").val(obj.subtitle_delay.toFixed(1));
			$('#subtitle-sel').toggleClass('btn-grad', !!obj.show_subtitle).toggleClass('btn-soft', !obj.show_subtitle);
		} else {
			$("#subdelay-box").prop('hidden', true);
		}

		var use_DNN = obj.vocal_info&0x40;
		has_instrumental = !!(use_DNN?(obj.vocal_info&1):(obj.vocal_info&4));
		guide_show((obj.vocal_info>>4)&3);
		$("#vol-pct").toggleClass('vol-norm', !!obj.vol_norm);
	} else {
		$("#now-playing").addClass('np-empty').text("{{getString1(69)}}");
		$(".control-box").prop('hidden', true);
	}

	if (obj.up_next) {
		$("#up-next").html(`<span class="text-truncate">${esc(obj.up_next)}</span>
			<span class="singer text-nowrap small"><i class="bi bi-person-fill"></i> ${esc(obj.next_user)}</span>`);
	} else {
		$("#up-next").html(`<span class="text-secondary">{{getString1(70)}}</span>`);
	}

	setPaused(obj.is_paused);

	if("volume" in obj && !volume_changing)
		showVol(obj.volume);
}
// volume is on VLC's scale: 256 = 100%, 512 = 200%
function showVol(v) {
	if (v === null || isNaN(v = +v)) return;	// no volume yet, or /vol_* answered False because nothing is playing
	$("#vol").val(v).css('--fill', v / 5.12 + '%');
	$("#vol-pct").text(Math.round(v / 2.56) + '%');
}
function getNowPlaying() { $.get('/nowplaying').done(update); }

function checkUser() {
	try{ return obj.now_playing_user=='Random' || currentUser==obj.now_playing_user; }
	catch(err){ return false; }
}

// 導唱 (guide vocal): on = original mix, off = instrumental. Vocal mode: 1 = music only, 2 = mixed, 3 = voice only
var has_instrumental = false;
function guide_show(mode) {
	var on = mode != 1;
	$("#guide").toggleClass('on', on).attr('aria-checked', on).prop('disabled', on && !has_instrumental);	// can't turn off without an instrumental track
	$("#guide-state").text(on ? '開' : '關');
}
$("#guide").click(function(){
	var on = !$(this).hasClass('on');
	guide_show(on ? 2 : 1);
	$.get("/play_vocal/" + (on ? 'mixed' : 'nonvocal'));
});

// Sliders
$("#transpose").on('input', function(){ $("#semitones-label").text(getSemitonesLabel(this.value)); })
	.on('change', function(){ $.get("/transpose/" + this.value); });
seektrack.onchange = () => { $.get("/seek/" + seektrack.value); }
seektrack.oninput = () => { $("#seektrack-val").text(getHHMMSS(seektrack.value)); }
$("#playspeed").on('input', function(){ $("#playspeed-val").val((this.value/100).toFixed(2)); })
	.on('change', function(){ $.get("/play_speed/" + this.value/100); });

// Transport
$("#pause-btn").click(() => { $.get("/pause", (is_paused) => setPaused(is_paused=='true')); });
$("#chorus").click(() => $.get("/seek_chorus"));
$(".seek-by").click(function(){ $.get("/seek_by/" + $(this).data('sec')); });
$("#skip").click(() => { if (checkUser() || confirm("{{getString1(72)}}")) $.get("/skip"); });

// Volume
$("#vol").on('input', function(){ volume_changing = true; showVol(this.value); })
	.on('change', function(){ $.get("/vol/" + this.value, (vol) => { volume_changing = false; showVol(vol); }); });
showVol({{ volume|tojson }});

// Typed values: Enter or leaving the field applies them
function bindTyped(sel, url, dflt, flag){
	$(sel).on('keydown', function(e){ if(e.key=='Enter') this.blur(); })
		.on('blur', function(){ $.get(url + (this.value==='' ? dflt : this.value)); window[flag] = false; });
}
bindTyped("#delay-val", "/audio_delay/", "0", "audiodelay_typing");
bindTyped("#subdelay-val", "/subtitle_delay/", "0", "subdelay_typing");
bindTyped("#playspeed-val", "/play_speed/", "1", "playspeed_typing");

$("#subtitle-sel").click(() => {$.get("/toggle_subtitle");});
$("#delay-inc").click(() => {$.get("/audio_delay/+", (d) => $("#delay-val").val(parseFloat(d).toFixed(2)));});
$("#delay-dec").click(() => {$.get("/audio_delay/-", (d) => $("#delay-val").val(parseFloat(d).toFixed(2)));});
$("#subdelay-inc").click(() => {$.get("/subtitle_delay/+", (d) => $("#subdelay-val").val(parseFloat(d).toFixed(1)));});
$("#subdelay-dec").click(() => {$.get("/subtitle_delay/-", (d) => $("#subdelay-val").val(parseFloat(d).toFixed(1)));});

// Help texts
$("#audiodelay-info").click(() => {showNotification("{{getString1(60)}}","is-info",8000)});
$("#subdelay-info").click(() => {showNotification("{{getString1(61)}}","is-info",8000)});
$("#semitones-info").click(() => {showNotification("{{getString1(62)}}","is-info",10000)});
$("#playspeed-info").click(() => {showNotification("{{getString1(200)}}","is-info",10000)});

getNowPlaying();
</script>
