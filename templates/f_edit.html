<div class="d-flex align-items-center gap-2 mb-3">
	<button class="btn btn-soft btn-round" onclick="switch_pane('/f_browse')"><i class="bi bi-arrow-left"></i></button>
	<h1 class="page-title">{{getString1(104)}}</h1>
</div>

<div class="ok-card p-4">
	<div class="text-warning fw-semibold mb-3 text-break">{{ filename_from_path(song.decode('utf-8')) }}</div>
	<input value="{{ song.decode('utf-8') }}" type="hidden" id="old_file_name">

	<label class="form-label small text-secondary" for="new_file_name">{{getString1(216)}}</label>
	<input autocomplete="off" id="new_file_name" class="form-control mb-4 edit-input" type="text" value="{{ filename_from_path(song.decode('utf-8')) }}">

	<div class="section-label mb-2">{{getString1(221)}}</div>
	<div class="row g-2 mb-4">
		<div class="col-6">
			<label class="form-label small text-secondary" for="new_trim_begin">{{getString1(223)}} <span id="old_trim_begin">00:00:00</span></label>
			<input autocomplete="off" id="new_trim_begin" class="form-control edit-input" type="text" value="00:00:00">
		</div>
		<div class="col-6">
			<label class="form-label small text-secondary" for="new_trim_end">{{getString1(224)}} <span id="old_trim_end">{{hhmmss}}</span></label>
			<input autocomplete="off" id="new_trim_end" class="form-control edit-input" type="text" value="{{hhmmss}}">
		</div>
	</div>

	<div class="section-label mb-2">{{getString1(222)}}</div>
	<label class="form-label small text-secondary" for="new_volume">{{getString1(225)}} <span id="old_volume">{{dBFS}}</span></label>
	<input autocomplete="off" id="new_volume" class="form-control mb-4 edit-input" type="number" value="{{dBFS}}">

	<div class="d-flex justify-content-between align-items-center">
		<button id="save-btn" class="btn btn-grad px-4" onclick="rename_song()" disabled>{{getString1(217)}}</button>
		<button class="btn btn-link text-danger text-decoration-none" onclick="delete_song()"><i class="bi bi-trash3"></i> {{getString1(218)}}</button>
	</div>
</div>

<script>
function check(){
	var old_name = $('#old_file_name').val().split('/').slice(-1)[0].split('.').slice(0,-1).join('.');
	var same = (old_name==$('#new_file_name').val() && $('#old_trim_begin').text()==$('#new_trim_begin').val()
		&& $('#old_trim_end').text()==$('#new_trim_end').val() && $('#old_volume').text()==$('#new_volume').val());
	$('#save-btn').prop('disabled', same);
}
function rename_song(){
	post_switch('/edit_song', {old_file_name: $('#old_file_name').val(), new_file_name: $("#new_file_name").val(),
		new_trim_begin: $('#new_trim_begin').val(), new_trim_end: $('#new_trim_end').val(), dBFS: $('#dBFS').val()})
}
function delete_song() {
	if (window.confirm("{{getString1(219)}}"))
		get_refresh("/files/delete?song={{url_escape(song)}}");
}
$('.edit-input').on('input change', check);
</script>
