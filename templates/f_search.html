<div class="d-flex align-items-center justify-content-between mb-3">
	<h1 class="page-title">{{getString1(117)}}</h1>
	<button class="btn btn-soft btn-round" title="{{getString1(233)}}" onclick="ASR('searchASR()')"><i class="bi bi-mic-fill"></i></button>
</div>

<!-- Search box -->
<div class="input-group input-group-lg mb-2">
	<span class="input-group-text bg-transparent border-end-0"><i class="bi bi-search"></i></span>
	<input class="form-control border-start-0 ps-0" list="suggestions" id="search-box" type="search" value="{{search_string}}"
		autocomplete="off" enterkeyhint="search" placeholder="{{getString1(118)}}">
	<datalist id="suggestions"></datalist>
	<button class="btn btn-grad px-3" id="add-queue-link" hidden><i class="bi bi-plus-lg"></i> {{getString1(119)}}</button>
	<button class="btn btn-grad px-3" id="search-link"><span class="spinner-border spinner-border-sm" hidden></span> {{getString1(118)}}</button>
</div>
<div class="d-flex justify-content-between align-items-center small mb-1">
	<div class="form-check form-switch m-0">
		<input class="form-check-input" type="checkbox" role="switch" id="search-karaoke" {% if search_karaoke %}checked{% endif %}>
		<label class="form-check-label" for="search-karaoke">{{getString1(120)}}</label>
	</div>
	<a class="link-secondary" data-bs-toggle="collapse" href="#advanced-settings" role="button"><i class="bi bi-sliders"></i> {{getString1(121)}}</a>
</div>
<p class="small text-secondary mb-3">{{getString1(122)}} {{getString1(123)}}</p>

<!-- Download options (shared by search results and direct URL) -->
<div class="collapse" id="advanced-settings">
	<div class="ok-card p-3 mb-3">
		<form class="download-direct">
			<label class="form-label small" for="direct-download-url">{{getString1(124)}}</label>
			<div class="input-group">
				<input class="form-control" id="direct-download-url" type="url" name="song_url" placeholder="https://www.youtube.com/watch?v=…" required>
				<button class="btn btn-soft" id="direct-download-button" type="submit"><i class="bi bi-download"></i> {{getString1(127)}}</button>
			</div>
		</form>
	</div>
</div>
<div class="d-flex flex-wrap gap-3 small mb-3" id="dl-options">
	<div class="form-check form-switch m-0" title="{{getString1(207)}}">
		<input class="form-check-input" type="checkbox" role="switch" id="opt-enqueue" checked><label class="form-check-label" for="opt-enqueue">{{getString1(125)}}</label>
	</div>
	<div class="form-check form-switch m-0" title="{{getString1(209)}}">
		<input class="form-check-input" type="checkbox" role="switch" id="opt-hq" {{'checked' if high_quality else ''}}><label class="form-check-label" for="opt-hq">{{getString1(206)}}</label>
	</div>
	<div class="form-check form-switch m-0" title="{{getString1(208)}}">
		<input class="form-check-input" type="checkbox" role="switch" id="opt-subs"><label class="form-check-label" for="opt-subs">{{getString1(126)}}</label>
	</div>
</div>

{% if search_results %}
<div class="section-label mb-2">{{getString1(129)}} “{{search_string}}”</div>
<div class="list-group">
	{% for title,url,id,dur in search_results %}
	<div class="list-group-item d-flex align-items-center gap-3">
		<a href="{{url}}" target="_blank" rel="noopener"><img class="result-thumb" loading="lazy" src="https://img.youtube.com/vi/{{id}}/mqdefault.jpg" alt=""></a>
		<div class="flex-grow-1" style="min-width:0">
			<div class="text-truncate-2">{{title}}</div>
			<div class="small text-secondary">{{dur}}</div>
		</div>
		<button class="btn btn-grad btn-round btn-dl flex-none" title="{{getString1(127)}}" data-url="{{url}}">
			<i class="bi bi-download"></i><span class="spinner-border spinner-border-sm"></span>
		</button>
	</div>
	{% endfor %}
</div>
{% endif %}

<script>
function startDownload(url, $btn){
	$.post('/download', {
		song_url: url,
		song_added_by: currentUser,
		...($('#opt-enqueue').is(':checked') ? {enqueue: 'on'} : {}),
		...($('#opt-hq').is(':checked') ? {high_quality: 'on'} : {}),
		...($('#opt-subs').is(':checked') ? {include_subtitles: 'on'} : {}),
	}, (msg) => showNotification(msg, 'is-info', 5000), 'text');
	$btn.addClass('loading').prop('disabled', true);
}
$('.btn-dl').click(function(){ startDownload($(this).data('url'), $(this)); });
$('.download-direct').submit(function(){
	startDownload($('#direct-download-url').val(), $('#direct-download-button'));
	return false;
});

function doSearch(){
	var search_term = $("#search-box").val();
	if (!search_term) return;
	$("#search-link .spinner-border").prop('hidden', false);
	post_switch("/f_search", {search_string: search_term, non_karaoke: $("#search-karaoke").is(":checked")});
}
function doQueue(){
	$.post("/enqueue", {song: suggests[$('#search-box').val()], user: currentUser}).then((data) => {
		var obj = JSON.parse(data);
		if (obj.success)
			showNotification("{{getString1(115)}}" + obj.song, "is-success")
		else
			showNotification("{{getString1(116)}}" + obj.song, "is-danger")
	});
}
$('#search-link').click(doSearch);
$('#add-queue-link').click(doQueue);
$('#search-box').on('keydown', function(e){
	if(e.key != 'Enter') return;
	e.preventDefault();
	if(suggests && this.value in suggests) doQueue(); else doSearch();
});

function countChars(s){
	var sum=0;
	for(var x=0; x<s.length; x++)
		sum += s.charCodeAt(x)>127?2:1;
	return sum;
}
var old_text, suggests;
function set_suggests(obj){
	suggests = obj;
	var html = '';
	for(var i of Object.keys(obj))
		html += `<option value="${esc(i)}">`;
	$('#suggestions').html(html);
	updateQueueButton();
}
function updateQueueButton(){
	var matched = suggests!=null && $('#search-box').val() in suggests;
	$('#add-queue-link').prop('hidden', !matched);
}
function searchASR(){
	var blob = new Blob(audios, { type: "audio/webm" });
	const req = new XMLHttpRequest();
	req.open("POST", '/get_ASR', true);
	req.onload = (e)=>{
		$('#search-box').val(e.target.responseText);
		$('#search-box').trigger('input');
		$('#search-box').focus();
	};
	req.send(blob);
}
$('#search-box').on('input', (ev) => {
	if(ev.target.value!=old_text && countChars(ev.target.value)>=4){
		old_text = ev.target.value;
		$.get('/suggest?q='+encodeURIComponent(ev.target.value)).then((data) => { set_suggests(JSON.parse(data)); });
	}
	updateQueueButton();
});
if(old_text && !$('#search-box').val()){
	$('#search-box').val(old_text);
	if(suggests) set_suggests(suggests);
}
</script>
